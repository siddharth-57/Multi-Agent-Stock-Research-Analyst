[project]
name = "stock-analyst"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Siddharth Chaudhari", email = "siddharthchaudhari40@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain-core>=1.8.4",
    "langchain-google-genai>=4.5.2",
    "langgraph>=1.2.24",
    "pandas>=3.1.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "yfinance>=1.8.0",
]

[project.scripts]
stock-analyst = "stock_analyst:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"   # lets async test functions run without extra decorators
asyncio_default_fixture_loop_scope = "function"   # each test gets a fresh event loop
